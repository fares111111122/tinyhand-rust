name: Rust build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options:
          - all
          - windows

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"os":"windows-latest","name":"windows-x86_64"}]' || '[{"os":"ubuntu-22.04","name":"linux-x86_64"},{"os":"windows-latest","name":"windows-x86_64"},{"os":"macos-15","name":"macos-arm64"},{"os":"macos-15-intel","name":"macos-x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libasound2-dev libxdo-dev libxrandr-dev libxcb-randr0-dev libxkbcommon-dev libgl1-mesa-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          ./scripts/package-rust-macos.sh
          ditto -c -k --sequesterRsrc --keepParent dist/TinyHand.app dist/TinyHand-${{ matrix.name }}.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/tinyhand README.md LICENSE dist/
          tar -czf dist/TinyHand-${{ matrix.name }}.tar.gz -C dist tinyhand README.md LICENSE
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/tinyhand.exe, README.md, LICENSE dist/
          Compress-Archive -Path dist/tinyhand.exe, dist/README.md, dist/LICENSE -DestinationPath dist/TinyHand-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TinyHand-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
